<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808"><meta name="description" content="Maya Music — Music. Feel. Repeat.">
<title>Maya Music — Developed by Dhanush</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#" data-page="home"><span class="brand-icon">♫</span><span>Maya<small>MUSIC • FEEL • REPEAT</small></span></a>
    <nav>
      <button class="nav active" data-page="home">⌂ <span>Home</span></button>
      <button class="nav" data-page="search">⌕ <span>Search</span></button>
      <button class="nav" data-page="library">▤ <span>Your Library</span></button>
      <button class="nav" data-page="upload">⇧ <span>Upload Music</span></button>
    </nav>
    <div class="side-section"><div class="side-heading">YOUR COLLECTION <button id="new-playlist" title="Create playlist">＋</button></div><div id="playlist-list" class="playlist-list"></div></div>
    <div class="sidebar-credit">Developed by <b>Dhanush</b></div>
  </aside>
  <main class="main">
    <header class="topbar"><div class="history"><button id="back" aria-label="Back">‹</button><button id="forward" aria-label="Forward">›</button></div><div class="top-actions"><span class="online-pill"><i></i> Maya is ready</span><button class="avatar" data-page="settings">D</button></div></header>
    <section id="view" class="view"></section>
  </main>
  <footer class="player">
    <div class="track-info"><div id="mini-cover" class="cover mini">♫</div><div class="track-text"><b id="mini-title">Choose a song</b><span id="mini-artist">Maya Music</span></div><button id="like-current" class="icon-btn" title="Like song">♡</button></div>
    <div class="player-center"><div class="player-controls"><button id="shuffle" class="icon-btn" title="Shuffle">⤨</button><button id="prev" class="icon-btn" title="Previous">|◀</button><button id="play" class="play-button" title="Play">▶</button><button id="next" class="icon-btn" title="Next">▶|</button><button id="repeat" class="icon-btn" title="Repeat">↻</button></div><div class="progress-row"><span id="current-time">0:00</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek"><span id="duration">0:00</span></div></div>
    <div class="player-extra"><button id="queue-btn" class="icon-btn" title="Queue">☷</button><span>♫</span><input id="volume" type="range" min="0" max="1" step=".01" value=".8" aria-label="Volume"></div>
    <audio id="audio" preload="metadata" crossorigin="anonymous"></audio>
  </footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
